#cloud-config
# One-time setup for the shared Hetzner Cloud server (CLAUDE.md §9).
# Paste into "Cloud config" when creating the server (Ubuntu 24.04).
# Replace TS_AUTHKEY_HERE with a one-off Tailscale auth key tagged tag:server.
# Do not commit the real key.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - unattended-upgrades

users:
  - default
  - name: deploy
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "local",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  # Docker Engine + Compose plugin from Docker's official repository
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker deploy

  # Tailscale with Tailscale SSH; the host is tag:server (SSH/deploy only)
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --authkey=TS_AUTHKEY_HERE --ssh --advertise-tags=tag:server --hostname=srv

  # App folders: /srv/apps/<app>/compose.yml + .env (root/deploy only)
  - install -d -o deploy -g deploy -m 0750 /srv/apps /srv/apps/trzosik

  # No OpenSSH: access only via Tailscale SSH (Hetzner web console stays as fallback)
  - systemctl disable --now ssh.socket ssh.service || true
